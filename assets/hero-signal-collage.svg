<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Abstract Black on Trend cultural signal collage</title>
  <desc id="desc">A violet, black, and cream editorial collage with media cards, city lights, civic shapes, sports lines, and signal waves.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08080d"/>
      <stop offset="0.45" stop-color="#12101a"/>
      <stop offset="1" stop-color="#5620d8"/>
    </linearGradient>
    <radialGradient id="violetGlow" cx="73%" cy="38%" r="52%">
      <stop offset="0" stop-color="#8c4dff" stop-opacity="0.72"/>
      <stop offset="0.45" stop-color="#7838ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="creamGlow" cx="78%" cy="25%" r="34%">
      <stop offset="0" stop-color="#fffaf1" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#fffaf1" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="10"/></filter>
    <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse">
      <path d="M70 0H0v70" fill="none" stroke="#fffaf1" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#fffaf1" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1600" height="1200" fill="url(#bg)"/>
  <rect width="1600" height="1200" fill="url(#violetGlow)"/>
  <rect width="1600" height="1200" fill="url(#creamGlow)"/>
  <rect width="1600" height="1200" fill="url(#grid)" opacity="0.8"/>
  <rect x="780" y="70" width="720" height="930" fill="url(#dots)" opacity="0.8"/>

  <!-- left dark wash for readable hero copy -->
  <rect x="0" y="0" width="760" height="1200" fill="#050509" opacity="0.54"/>
  <rect x="0" y="0" width="980" height="1200" fill="url(#bg)" opacity="0.30"/>

  <!-- editorial card cluster -->
  <g opacity="0.98">
    <rect x="930" y="118" width="410" height="520" rx="38" fill="#fffaf1" opacity="0.08" stroke="#fffaf1" stroke-opacity="0.18"/>
    <rect x="970" y="166" width="172" height="26" rx="13" fill="#fffaf1" opacity="0.82"/>
    <rect x="970" y="222" width="292" height="24" rx="12" fill="#fffaf1" opacity="0.36"/>
    <rect x="970" y="264" width="240" height="24" rx="12" fill="#fffaf1" opacity="0.28"/>
    <rect x="970" y="330" width="296" height="190" rx="24" fill="#7838ff" opacity="0.72"/>
    <path d="M1010 472c74-120 154-118 222-10" fill="none" stroke="#fffaf1" stroke-opacity="0.72" stroke-width="18" stroke-linecap="round"/>
    <circle cx="1116" cy="398" r="38" fill="#fffaf1" opacity="0.82"/>
    <rect x="970" y="554" width="216" height="18" rx="9" fill="#fffaf1" opacity="0.44"/>
  </g>

  <g transform="rotate(-8 1050 720)">
    <rect x="820" y="650" width="440" height="292" rx="34" fill="#0b0b10" stroke="#fffaf1" stroke-opacity="0.20"/>
    <rect x="856" y="694" width="116" height="36" rx="10" fill="#7838ff"/>
    <rect x="856" y="770" width="320" height="32" rx="16" fill="#fffaf1" opacity="0.86"/>
    <rect x="856" y="820" width="260" height="32" rx="16" fill="#fffaf1" opacity="0.62"/>
    <path d="M878 890H1190" stroke="#fffaf1" stroke-opacity="0.32" stroke-width="3"/>
  </g>

  <g transform="rotate(7 1260 780)">
    <rect x="1140" y="700" width="320" height="430" rx="42" fill="#7838ff" stroke="#fffaf1" stroke-opacity="0.22"/>
    <rect x="1184" y="760" width="140" height="22" rx="11" fill="#0b0b10" opacity="0.72"/>
    <rect x="1184" y="832" width="224" height="38" rx="19" fill="#fffaf1" opacity="0.86"/>
    <rect x="1184" y="890" width="184" height="38" rx="19" fill="#fffaf1" opacity="0.68"/>
    <rect x="1184" y="1006" width="226" height="5" rx="2" fill="#fffaf1" opacity="0.62"/>
  </g>

  <!-- cultural signal lines / sports + civic geometry -->
  <g fill="none" stroke-linecap="round">
    <path d="M690 220c120 36 202 112 252 224" stroke="#fffaf1" stroke-opacity="0.26" stroke-width="4"/>
    <path d="M735 160c166 44 288 158 354 320" stroke="#fffaf1" stroke-opacity="0.18" stroke-width="3"/>
    <path d="M780 96c210 54 368 214 448 430" stroke="#fffaf1" stroke-opacity="0.12" stroke-width="3"/>
    <circle cx="700" cy="726" r="156" stroke="#fffaf1" stroke-opacity="0.14" stroke-width="4"/>
    <path d="M544 726h312M700 570v312" stroke="#fffaf1" stroke-opacity="0.12" stroke-width="4"/>
    <path d="M1450 185l68 68-68 68-68-68z" stroke="#fffaf1" stroke-opacity="0.25" stroke-width="5"/>
    <path d="M1450 210v86M1407 253h86" stroke="#fffaf1" stroke-opacity="0.22" stroke-width="5"/>
  </g>

  <!-- city/crowd silhouette -->
  <g opacity="0.55">
    <path d="M710 1040h890v160H710z" fill="#050509"/>
    <rect x="760" y="900" width="42" height="140" fill="#050509"/>
    <rect x="830" y="842" width="62" height="198" fill="#050509"/>
    <rect x="930" y="918" width="54" height="122" fill="#050509"/>
    <rect x="1042" y="808" width="72" height="232" fill="#050509"/>
    <rect x="1170" y="875" width="58" height="165" fill="#050509"/>
    <rect x="1288" y="826" width="80" height="214" fill="#050509"/>
    <rect x="1422" y="920" width="54" height="120" fill="#050509"/>
    <circle cx="870" cy="1052" r="34" fill="#050509"/>
    <circle cx="955" cy="1056" r="28" fill="#050509"/>
    <circle cx="1062" cy="1050" r="38" fill="#050509"/>
    <circle cx="1168" cy="1058" r="30" fill="#050509"/>
    <circle cx="1265" cy="1053" r="36" fill="#050509"/>
    <circle cx="1378" cy="1057" r="30" fill="#050509"/>
  </g>

  <!-- foreground depth -->
  <circle cx="1410" cy="520" r="130" fill="#7838ff" opacity="0.20" filter="url(#blur)"/>
  <circle cx="1120" cy="1040" r="220" fill="#fffaf1" opacity="0.06" filter="url(#blur)"/>
  <rect width="1600" height="1200" fill="#000" opacity="0.10"/>
</svg>
