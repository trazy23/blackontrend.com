<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1380" role="img" aria-labelledby="title desc">
  <title id="title">Black on Trend editorial hero image</title>
  <desc id="desc">A premium violet and cream editorial collage showing a city, crowd silhouettes, media cards, signal lines, and Black cultural intelligence motifs.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf1"/>
      <stop offset="0.42" stop-color="#eee5d6"/>
      <stop offset="1" stop-color="#7838ff"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b10"/>
      <stop offset="1" stop-color="#201333"/>
    </linearGradient>
    <radialGradient id="glow" cx="62%" cy="28%" r="62%">
      <stop offset="0" stop-color="#9b6cff" stop-opacity=".82"/>
      <stop offset=".45" stop-color="#7838ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#0b0b10" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="58" height="58" patternUnits="userSpaceOnUse">
      <path d="M58 0H0v58" fill="none" stroke="#0b0b10" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#0b0b10" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1100" height="1380" rx="64" fill="url(#base)"/>
  <rect width="1100" height="1380" rx="64" fill="url(#grid)"/>
  <rect width="1100" height="1380" rx="64" fill="url(#glow)"/>

  <g transform="translate(70 72)" filter="url(#shadow)">
    <rect width="420" height="500" rx="42" fill="#0b0b10"/>
    <rect x="36" y="40" width="156" height="44" rx="12" fill="#7838ff"/>
    <text x="58" y="70" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800" letter-spacing="2" fill="#fffaf1">THE BLACK</text>
    <text x="36" y="190" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="78" font-weight="900" letter-spacing="-6" fill="#fffaf1">ANGLE</text>
    <rect x="36" y="252" width="310" height="18" rx="9" fill="#fffaf1" opacity=".72"/>
    <rect x="36" y="292" width="240" height="18" rx="9" fill="#fffaf1" opacity=".46"/>
    <rect x="36" y="354" width="348" height="90" rx="24" fill="#7838ff" opacity=".92"/>
    <text x="62" y="409" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="800" fill="#fffaf1">SIGNAL OVER NOISE</text>
  </g>

  <g transform="translate(540 120) rotate(5)" filter="url(#shadow)">
    <rect width="420" height="640" rx="54" fill="#7838ff"/>
    <rect x="44" y="52" width="150" height="42" rx="12" fill="#0b0b10"/>
    <text x="66" y="80" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="#fffaf1">FUTURE</text>
    <text x="44" y="234" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="72" font-weight="900" letter-spacing="-5" fill="#fffaf1">WHAT'S</text>
    <text x="44" y="314" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="72" font-weight="900" letter-spacing="-5" fill="#fffaf1">MOVING</text>
    <path d="M52 450 C138 360 232 540 336 412" fill="none" stroke="#fffaf1" stroke-width="16" stroke-linecap="round" opacity=".78"/>
    <circle cx="96" cy="448" r="18" fill="#0b0b10"/>
    <circle cx="218" cy="490" r="18" fill="#0b0b10"/>
    <circle cx="336" cy="412" r="18" fill="#0b0b10"/>
  </g>

  <g transform="translate(104 690)">
    <path d="M0 420h920v150H0z" fill="#0b0b10" opacity=".98"/>
    <rect x="54" y="250" width="52" height="170" fill="#0b0b10"/>
    <rect x="144" y="186" width="74" height="234" fill="#0b0b10"/>
    <rect x="264" y="272" width="60" height="148" fill="#0b0b10"/>
    <rect x="396" y="140" width="86" height="280" fill="#0b0b10"/>
    <rect x="550" y="224" width="70" height="196" fill="#0b0b10"/>
    <rect x="704" y="172" width="92" height="248" fill="#0b0b10"/>
    <circle cx="160" cy="438" r="44" fill="#0b0b10"/>
    <circle cx="278" cy="442" r="34" fill="#0b0b10"/>
    <circle cx="418" cy="436" r="48" fill="#0b0b10"/>
    <circle cx="560" cy="444" r="38" fill="#0b0b10"/>
    <circle cx="690" cy="438" r="45" fill="#0b0b10"/>
    <circle cx="820" cy="444" r="36" fill="#0b0b10"/>
  </g>

  <g fill="none" stroke="#0b0b10" stroke-linecap="round" opacity=".24">
    <path d="M680 850c-120-160-300-172-478-52" stroke-width="8"/>
    <path d="M750 902c-170-210-402-236-636-74" stroke-width="5"/>
    <circle cx="862" cy="920" r="112" stroke-width="8"/>
    <path d="M750 920h224M862 808v224" stroke-width="6"/>
  </g>

  <rect x="0" y="0" width="1100" height="1380" rx="64" fill="none" stroke="#fffaf1" stroke-opacity=".34" stroke-width="3"/>
</svg>
